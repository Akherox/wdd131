<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - WDD 131 - Bryan Bravo</title>
    <meta name="description"
        content="A product review form built with HTML, CSS, and JavaScript for WDD 131 - Dynamic Web Fundamentals, by Bryan Bravo.">
    <meta name="author" content="Bryan Bravo">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=optional"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header class="body-header">
        <h1>Product Review Form</h1>
        <!-- <p class="subtitle">Share your experience to help us improve this product.</p> -->
    </header>

    <main>
        <form method="get" action="review.html" novalidate>

            <div class="field">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="field">
                <legend>Overall Rating</legend>
                <div class="stars">
                    <input type="radio" id="rating5" name="rating" value="5" required>
                    <label for="rating5" title="5 stars" aria-label="5 stars"></label>

                    <input type="radio" id="rating4" name="rating" value="4" required>
                    <label for="rating4" title="4 stars" aria-label="4 stars"></label>

                    <input type="radio" id="rating3" name="rating" value="3" required>
                    <label for="rating3" title="3 stars" aria-label="3 stars"></label>

                    <input type="radio" id="rating2" name="rating" value="2" required>
                    <label for="rating2" title="2 stars" aria-label="2 stars"></label>

                    <input type="radio" id="rating1" name="rating" value="1" required>
                    <label for="rating1" title="1 star" aria-label="1 star"></label>
                </div>
            </fieldset>

            <div class="field">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="field">
                <legend>Which features did you find useful? <span class="hint">(check all that apply)</span></legend>
                <div class="checkbox-grid">
                    <div class="checkbox-row">
                        <input type="checkbox" id="featureDurability" name="features" value="durability">
                        <label for="featureDurability">Durability</label>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="featureEase" name="features" value="ease-of-use">
                        <label for="featureEase">Ease of Use</label>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="featurePerformance" name="features" value="performance">
                        <label for="featurePerformance">Performance</label>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="featureDesign" name="features" value="design">
                        <label for="featureDesign">Design</label>
                    </div>
                </div>
            </fieldset>

            <div class="field">
                <label for="review">Written Review <span class="hint">(optional)</span></label>
                <textarea id="review" name="review" rows="5"
                    placeholder="What worked well, what didn't, and would you recommend it?"></textarea>
            </div>

            <div class="field">
                <label for="userName">Your Name <span class="hint">(optional)</span></label>
                <input type="text" id="userName" name="userName" placeholder="e.g. Jamie Smith">
            </div>

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Bryan Bravo, WDD 131</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
